{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block page_id %}login{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="auth-visual" aria-hidden="true">
    <span class="sun"></span>
    <span class="orbit orbit-one"></span>
    <span class="orbit orbit-two"></span>
    <span class="mini-planet planet-blue"></span>
    <span class="mini-planet planet-coral"></span>
  </div>
  <h1>Welcome back</h1>
  <p class="lede">Pick up your solar system lesson and keep exploring.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="auth-form">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit" data-track="login-submit">Login</button>
  </form>
  <p class="form-note">No account? <a href="/signup">Sign up</a></p>
</section>
{% endblock %}
