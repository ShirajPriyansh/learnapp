<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Learning App{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page-id="{% block page_id %}{% endblock %}">
  {% if username %}
  <nav class="app-nav">
    <a class="brand" href="{% if session.get('is_admin') %}/admin/clickstream{% else %}/lesson{% endif %}" data-track="nav-home">
      <span class="brand-mark">O</span>
      <span>Ed Tech Tutor</span>
    </a>
    <div class="nav-links">
      {% if session.get('is_admin') %}
      <span class="user-chip">Hi, {{ username }} (Admin)</span>
      <a href="/admin/clickstream" data-track="nav-clickstream">Clickstream Data</a>
      {% else %}
      <span class="user-chip">Hi, {{ username }}</span>
      <a href="/lesson" data-track="nav-lesson">Lesson</a>
      <a href="/quiz" data-track="nav-quiz">Quiz</a>
      {% endif %}
      <a href="/logout" data-track="nav-logout">Logout</a>
    </div>
  </nav>
  {% endif %}

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/js/tracker.js"></script>
</body>
</html>
